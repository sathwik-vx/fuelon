<style>
:root{--bg:#0a0f1e;--card:#1a1d24;--card2:#232731;--acc:#ffd60a;--tx:#fff;--mu:#9aa1b0;--ok:#22c55e;--wa:#f59e0b;--er:#ef4444;--bd:#2d3240;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;overflow-x:hidden}

#app{display:flex;min-height:100vh}
.side{display:none;width:230px;padding:24px 16px;border-right:1px solid var(--bd);position:sticky;top:0;height:100vh;flex-direction:column;gap:6px}
.main{flex:1;min-width:0;padding:20px 16px 96px;max-width:920px;margin:0 auto;width:100%}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d1224ee;border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px);z-index:5}
.nav button,.side button.nv{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px;font-size:11px;cursor:pointer;border-radius:10px}
.nav button.on,.side button.nv.on{color:var(--acc)}
.nav b{display:block;font-size:18px;font-weight:400}
.side button.nv{flex:none;text-align:left;font-size:15px;padding:11px 12px;display:flex;gap:10px}
.side button.nv.on{background:var(--card)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px;margin-bottom:18px}.logo i{font-style:normal;color:var(--acc)}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.5px}h2{font-size:17px;margin:22px 0 10px}
p{margin:0}.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:0 6px 20px #0006;margin-bottom:12px}
.grid{display:grid;gap:12px}
.svc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;cursor:pointer;transition:.2s}
.svc:hover{border-color:var(--acc);transform:translateY(-2px)}
.ic{width:46px;height:46px;border-radius:14px;background:#ffd60a1f;color:var(--acc);display:grid;place-items:center;font-size:22px;flex:none}
.btn{background:var(--acc);color:#111;border:0;border-radius:12px;padding:13px 20px;font-weight:700;cursor:pointer;transition:.2s;width:100%}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:wait}
.btn.g{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}.btn.d{background:#ef44441f;color:#ff8a8a;border:1px solid #ef444455}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.chip{background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center;cursor:pointer}
.chip.on{border-color:var(--acc);background:#ffd60a1a;color:var(--acc)}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 6px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.err{color:#ff8a8a;font-size:13px;margin-top:6px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:99px;background:#f59e0b22;color:var(--wa);font-weight:600}
.tag.ok{background:#22c55e22;color:var(--ok)}.tag.er{background:#ef444422;color:#ff8a8a}
.demo{border:1px dashed #ffd60a66;color:var(--acc);border-radius:12px;padding:9px 12px;font-size:12.5px;margin-bottom:16px}
.sp{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:14px}.sp:last-child{border:0}.sp span:first-child{color:var(--mu)}
.steps{display:flex;margin:18px 0 6px}
.st{flex:1;text-align:center;font-size:11px;color:var(--mu);position:relative}
.st:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:3px;background:var(--bd)}.st:first-child:before{display:none}
.st.on:before{background:var(--acc)}
.dot{width:28px;height:28px;border-radius:50%;background:var(--card2);border:2px solid var(--bd);margin:0 auto 6px;display:grid;place-items:center;position:relative;z-index:1;font-size:13px}
.st.on .dot{background:var(--acc);border-color:var(--acc);color:#111}.st.on{color:var(--tx)}
.map{height:200px;border-radius:16px;border:1px solid var(--bd);background:linear-gradient(#ffffff0a 1px,transparent 1px) 0 0/28px 28px,linear-gradient(90deg,#ffffff0a 1px,transparent 1px) 0 0/28px 28px,#101626;position:relative;overflow:hidden;margin-bottom:12px}
.pin{position:absolute;transform:translate(-50%,-100%);background:none;border:0;font-size:24px;cursor:pointer;padding:0}
.pin.on{filter:drop-shadow(0 0 6px var(--acc));font-size:30px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:600;padding:10px 18px;border-radius:99px;z-index:9;font-size:14px;max-width:92vw}
.hero{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px;max-width:420px;margin:0 auto}
.hero .big{font-size:56px;width:100px;height:100px;border-radius:28px;background:var(--acc);color:#111;display:grid;place-items:center;box-shadow:0 0 60px #ffd60a44}
.hero h1{font-size:44px}
@media(min-width:820px){.side{display:flex}.nav{display:none}.main{padding:32px 32px 48px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}}

.land{width:100%;overflow-x:hidden}
.ln{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:6px;padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;background:#0a0f1ecc;backdrop-filter:blur(10px);border-bottom:1px solid #ffffff12}
.ln .logo{margin:0;flex:1}.ln .lk{background:none;border:0;color:var(--mu);cursor:pointer;padding:8px 10px;display:none}.ln .lk:hover{color:var(--tx)}.ln .btn{width:auto;padding:9px 16px}
.hero2{position:relative;min-height:100vh;padding:110px 20px 50px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;background:radial-gradient(700px 400px at 10% 0,#1b2a5a88,transparent 60%),#060912}
.hero2:before{content:"";position:absolute;inset:0;background:radial-gradient(520px 300px at 70% 100%,#ffd60a33,transparent);animation:glow 7s ease-in-out infinite alternate}
.hc{position:relative;z-index:2;max-width:1100px;margin:0 auto;width:100%}
.hero2 h1{font-size:clamp(38px,7vw,76px);line-height:1.02;letter-spacing:-2px;margin:18px 0 0}
.rise{opacity:0;transform:translateY(24px);animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
.scene{position:relative;width:100%;max-width:760px;aspect-ratio:2.2/1;margin:34px auto 0}
.road{position:absolute;inset:0;width:100%;height:100%}
.dash{animation:flow 1s linear infinite}.edge{filter:drop-shadow(0 0 4px #ffd60a)}
.car{position:absolute;left:50%;bottom:2%;width:36%;transform:translateX(-50%);animation:drive 1.6s cubic-bezier(.2,.7,.2,1) both,bob 1.1s ease-in-out 1.6s infinite}.tl{filter:drop-shadow(0 0 6px #ef4444)}
.pt{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--acc);opacity:.6;left:var(--x);bottom:-10px;animation:up 8s linear infinite;animation-delay:var(--d)}
.fl{position:absolute;background:#1a1d24cc;border:1px solid #ffffff1f;backdrop-filter:blur(8px);border-radius:14px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center;animation:fl 4s ease-in-out infinite;color:var(--acc)}
.live{display:inline-flex;gap:8px;align-items:center;font-size:13px;background:#22c55e1a;color:var(--ok);border:1px solid #22c55e44;padding:6px 12px;border-radius:99px}

.sec{padding:64px 20px;max-width:1100px;margin:0 auto}.sec>h2{font-size:clamp(26px,4vw,40px);letter-spacing:-1px;margin:0 0 26px}
.il{height:110px;border-radius:14px;margin-bottom:14px;display:grid;place-items:center;font-size:44px;color:var(--acc)}
.il1{background:radial-gradient(circle at 50% 120%,#ffd60a44,transparent 70%),#10152a}.il2{background:linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/22px 22px,#10152a}.il3{background:repeating-linear-gradient(135deg,#ffd60a14 0 10px,transparent 10px 20px),#10152a}
.how{display:grid;gap:22px}.hs{position:relative;padding-left:56px}
.hs:before{content:"";position:absolute;left:19px;top:42px;bottom:-22px;width:2px;background:linear-gradient(var(--acc),#ffd60a22);animation:lineIn 1.2s both}.hs:last-child:before{display:none}
.hs .n{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--acc);color:#111;display:grid;place-items:center;font-weight:800}
.ba{display:grid;gap:14px}.ba .card{padding:22px}
.ft{border-top:1px solid var(--bd);padding:36px 20px 40px;max-width:1100px;margin:0 auto}.ft button{display:block;background:none;border:0;color:var(--mu);padding:4px 0;cursor:pointer;text-align:left}.ft button:hover{color:var(--acc)}
.call{max-width:460px;margin:0 auto;text-align:center;padding:8px 0}
.ring{width:132px;height:132px;margin:12px auto 18px;border-radius:50%;display:grid;place-items:center;position:relative}
.ring:before,.ring:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);animation:rg 2.2s ease-out infinite}.ring:after{animation-delay:1.1s}
.ring.q:before,.ring.q:after{animation:none;opacity:0}
.av{width:104px;height:104px;border-radius:50%;background:var(--acc);color:#111;display:grid;place-items:center;font-size:46px;position:relative;z-index:1}
.wave{display:flex;gap:4px;justify-content:center;align-items:center;height:48px;margin:12px 0}.wave span{width:4px;height:6px;border-radius:3px;background:var(--acc);opacity:.45}
.wave.on span{opacity:1;animation:wv .9s ease-in-out infinite;animation-delay:var(--d)}
.radar{width:90px;height:90px;border-radius:50%;border:2px solid var(--acc);margin:0 auto 26px;animation:rg 1.6s infinite}
.ok-c{width:84px;height:84px;margin:10px auto;border-radius:50%;background:#22c55e22;color:var(--ok);display:grid;place-items:center;font-size:44px;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
details{border-bottom:1px solid var(--bd);padding:12px 0}summary{cursor:pointer;font-weight:600}details p{color:var(--mu);font-size:14px;margin-top:8px}
@keyframes rise{to{opacity:1;transform:none}}@keyframes glow{from{opacity:.35}to{opacity:1}}@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes drive{from{transform:translateX(-50%) translateY(45%);opacity:0}to{transform:translateX(-50%);opacity:1}}@keyframes bob{50%{translate:0 -3px}}@keyframes up{to{transform:translateY(-110vh);opacity:0}}
@keyframes fl{50%{transform:translateY(-10px)}}@keyframes pulse{0%{box-shadow:0 0 0 0 #22c55e88}100%{box-shadow:0 0 0 10px #22c55e00}}
@keyframes lineIn{from{opacity:0}}@keyframes rg{from{transform:scale(.8);opacity:.9}to{transform:scale(1.5);opacity:0}}@keyframes wv{50%{height:42px}}@keyframes pop{from{transform:scale(0)}}
@media(min-width:820px){.ln .lk{display:block}.how{grid-template-columns:repeat(4,1fr)}.hs{padding:56px 0 0}.hs:before{left:44px;right:-22px;top:19px;bottom:auto;width:auto;height:2px;background:linear-gradient(90deg,var(--acc),#ffd60a22)}.ba{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.rise{opacity:1;transform:none}}
</style>

 return '<div style="text-align:center"><div class="ok-c">✅</div><h1>Your service partner has been assigned!</h1><p class="mu">Sample provider · fictional demo profile</p></div><div class="card" style="margin-top:18px"><div style="display:flex;gap:14px;align-items:center"><div class="ic" style="width:60px;height:60px;border-radius:50%;font-weight:800">'+esc(ini)+'</div><div><b>'+esc(p.name)+'</b><div class="mu">'+esc(p.role)+'</div></div></div><div style="margin-top:10px"><div class="sp"><span>Service</span><span>'+esc(b.title)+'</span></div><div class="sp"><span>Rating</span><span>★ '+p.rating+'/5 (sample)</span></div><div class="sp"><span>Vehicle</span><span>'+esc(p.vehicle)+'</span></div><div class="sp"><span>Experience</span><span>'+esc(p.exp)+' (fictional)</span></div><div class="sp"><span>Contact</span><span>'+esc(p.phone)+'</span></div><div class="sp"><span>Estimated arrival</span><span>'+b.eta+' min (simulated)</span></div><div class="sp"><span>Booking ID</span><b>'+esc(b.id)+'</b></div></div></div><div class="row"><button class="btn g" data-a="demo">📞 Contact (demo)</button><button class="btn" data-a="go" data-v="call">Continue to confirmation call</button></div><button class="btn g" style="margin-top:10px" data-a="go" data-v="track">Track My Request</button>'+(b.call==="Pending"?'<p class="mu" style="margin-top:12px;font-size:13px;text-align:center">Opening the confirmation call automatically…</p>':"")},
call:function(){var b=byId(S.cur);if(!b)return noB();
 if(b.cancelled)return '<div class="card">This booking was cancelled.<button class="btn" style="margin-top:12px" data-a="go" data-v="history">Booking history</button></div>';
 if(b.call==="Confirmed")return '<div class="call"><div class="ok-c">✅</div><h1>Booking Confirmed</h1><p class="mu">Confirmed by you on the simulated AI call.</p><div class="card" style="text-align:left;margin:18px 0 12px"><div class="sp"><span>Booking ID</span><b>'+esc(b.id)+'</b></div><div class="sp"><span>Service</span><span>'+esc(b.title)+'</span></div><div class="sp"><span>Provider (sample)</span><span>'+esc(b.provider.name)+'</span></div><div class="sp"><span>Estimated arrival</span><span>'+b.eta+' min (simulated)</span></div><div class="sp"><span>Location</span><span style="text-align:right">'+esc(b.loc)+'</span></div></div><button class="btn" data-a="go" data-v="track">Track My Assistance</button></div>';
 var m=callMsg(b),live=ui.stage==="live",bars="";for(var i=0;i<24;i++)bars+='<span style="--d:'+((i%8)*0.09).toFixed(2)+'s"></span>';
 var btn=ui.cc?'<div class="card"><p>Cancel this booking?</p><div class="row" style="margin-top:12px"><button class="btn d" data-a="cyes">Yes, cancel</button><button class="btn g" data-a="cno">Keep booking</button></div></div>':live?'<div class="grid"><button class="btn g" data-a="replay">Replay message</button><button class="btn" data-a="cconf">Confirm Booking</button><button class="btn d" data-a="cancel">Cancel Booking</button></div>':'<div class="grid"><button class="btn" data-a="answer">Answer</button><button class="btn d" data-a="cancel">Decline &amp; Cancel Booking</button></div>';
 return '<div class="call"><div class="mu" style="font-size:12px">Simulated in-app call · no real phone call is placed</div><div class="ring'+(live?" q":"")+'"><div class="av">⛽</div></div><h1>FuelOn AI Assistant</h1><p class="mu">'+(live?(ui.sp?"Connected · speaking…":"Connected"):"Incoming call…")+'</p><div class="mu" id="ct">00:00</div><div class="wave'+(ui.sp?" on":"")+'">'+bars+'</div>'+(live&&!speechOK()?'<div class="err" style="margin-bottom:10px">Voice playback isn’t supported in this browser. Please read the message below.</div>':"")+'<div class="card" style="text-align:left">'+(live?esc(m.text):"Answer the call to hear your booking confirmation.")+'</div>'+btn+'</div>'},
history:function(){return '<h1>Booking History</h1><div style="margin-top:16px">'+(S.bookings.length?S.bookings.map(bcard).join(""):'<div class="card mu">No bookings yet.</div>')+'</div>'},
alerts:function(){var ev=[];S.bookings.slice(0,6).forEach(function(b){var t=b.created||0;ev.push(["✅","Booking received",b.id+" · "+b.title,t]);ev.push(["🛠","Provider assigned",b.provider.name+" · "+b.id,t+1]);
  if(b.cancelled)ev.push(["🔔","Booking cancelled",b.id,t+2]);else if(b.call==="Pending")ev.push(["📞","Confirmation pending",b.id+" · awaiting your confirmation",t+2]);else{ev.push(["✅","Booking confirmed",b.id,b.confirmedAt||t+2]);if(b.status===4)ev.push(["✅","Assistance completed",b.id,t+3e6])}});
 ev.sort(function(a,c){return c[3]-a[3]});
 return '<h1>Notifications</h1><p class="mu">Generated from your demo booking events.</p><div style="margin-top:16px">'+(ev.length?ev.map(function(e){return '<div class="card" style="display:flex;gap:12px;align-items:center"><div class="ic">'+e[0]+'</div><div><b>'+e[1]+'</b><div class="mu">'+esc(e[2])+'</div></div></div>'}).join(""):'<div class="card mu">No notifications yet.</div>')+'</div>'},
help:function(){var q=[["How does booking work?","Pick a service, enter details and your location, review the illustrative price, then confirm the demo booking."],["How is a provider assigned?","A sample provider is picked from a fictional list that supports your selected service. A towing specialist is never assigned to a fuel request."],["What is the confirmation call?","An in-app simulation of an automated AI voice call. Your browser reads your booking details aloud (if supported) and you confirm with a button. No real phone call is placed."],["Is fuel really delivered?","No. FuelOn is an academic prototype. Fuel help is a concept limited to authorised providers where legally permitted."],["Support contact","support@fuelon.example (placeholder)"]];
 return '<h1>Help Centre</h1><div class="card" style="margin-top:16px">'+q.map(function(x){return '<details><summary>'+x[0]+'</summary><p>'+x[1]+'</p></details>'}).join("")+'</div><div class="demo">'+NOTICE+'</div>'},
profile:function(){var h=S.bookings;return '<h1>Profile</h1><div class="card" style="margin-top:16px;display:flex;gap:14px;align-items:center"><div class="ic" style="border-radius:50%">☺</div><div><b>'+esc(S.name)+'</b><div class="mu">demo.user@fuelon.example</div></div></div>'+
 vehBlock()+
 '<h2>Saved locations</h2><div class="card">'+(S.saved.length?S.saved.map(function(s){return '<div class="sp"><span>📍</span><span style="text-align:right">'+esc(s)+'</span></div>'}).join(""):'<span class="mu">None saved. Confirm a location to save it.</span>')+'</div>'+
 '<h2>Booking history</h2>'+(h.length?h.map(bcard).join(""):'<div class="card mu">No bookings yet.</div>')+
 '<h2>Help &amp; settings</h2><div class="card"><div class="sp"><span>Support</span><span>support@fuelon.example (demo)</span></div><div class="sp"><span>Team</span><span>VISION X</span></div><button class="btn d" style="margin-top:12px" data-a="reset">Clear demo data</button></div>'}
};
function render(){var a=document.getElementById("app");var fn=V[route]||V.home;
 if(route==="welcome"){a.innerHTML=ei(fn());return}
 var MP={fuel:"home",location:"home",summary:"home",services:"home",help:"home",alerts:"home",assigned:"track",call:"track",history:"profile"},on=MP[route]||route;
 var side='<aside class="side"><div class="logo">Fuel<i>On</i></div>'+NAV.map(function(n){return '<button class="nv'+(n[0]===on?" on":"")+'" data-a="go" data-v="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join("")+'<div style="flex:1"></div><span class="tag">Demo Mode</span></aside>';
 var nav='<nav class="nav">'+NAV.map(function(n){return '<button class="'+(n[0]===on?"on":"")+'" data-a="go" data-v="'+n[0]+'"><b>'+n[1]+'</b>'+n[2]+'</button>'}).join("")+'</nav>';
 a.innerHTML=ei(side+'<main class="main">'+fn()+'</main>'+nav);after()}
function validLoc(){return (F.loc||"").trim().length>=3}
function submitFuel(){var e={};if(!F.veh)e.veh="Please select a vehicle.";if(!F.fuel)e.fuel="Please select a fuel type.";if(!validLoc())e.loc="Enter your location (at least 3 characters).";
 if(Object.keys(e).length){ui.e=e;render();return}
 var q=+F.qty||2,fc=PRICE[F.fuel]*q;S.loc=F.loc.trim();
 S.draft={type:"fuel",sub:"fuel",title:"Emergency Fuel Assistance",veh:F.veh,fuel:F.fuel,qty:q,loc:S.loc,fuelCost:fc,fee:99,total:fc+99};save();go("summary")}
function submitRoad(){var e={};if(!F.sub)e.sub="Please choose a service.";if(!F.veh)e.veh="Please select a vehicle.";if(!(F.desc||"").trim())e.desc="Describe the issue briefly.";if(!validLoc())e.loc="Enter your location (at least 3 characters).";
 if(Object.keys(e).length){ui.e=e;render();return}
 var r=RS[F.sub];S.loc=F.loc.trim();S.draft={type:"road",veh:F.veh,sub:F.sub,title:r.t,desc:F.desc.trim(),loc:S.loc,fee:r.f,total:r.f};save();go("summary")}
function confirmBooking(){if(!S.draft||ui.busy)return;ui.busy=true;render();
 setTimeout(function(){var d=S.draft;if(!d){return}var b=Object.assign({},d,{id:newId(),status:0,cancelled:false,pay:S.pay,created:Date.now(),call:"Pending",provider:assign(d.sub),eta:Math.floor(Math.random()*20)+10});
  S.bookings.unshift(b);S.cur=b.id;S.draft=null;F={};save();toast("Booking created ✓");go("assigned")},900)}
var acts={
go:function(v){if(v==="fuel"||v==="roadside")F={};go(v)},
set:function(v,el){F[el.dataset.k]=v;if(ui.e)delete ui.e[el.dataset.k];render()},
subfuel:submitFuel,subroad:submitRoad,
pick:function(v){ui.sel=+v;render()},
paym:function(v){S.pay=v;save();render()},
confirm:confirmBooking,
adv:function(){var b=byId(S.cur);if(b&&!b.cancelled&&b.status<4&&b.call!=="Pending"){b.status++;save();if(b.status===4)toast("Request completed (simulated)");render()}},
cancel:function(){ui.cc=true;render()},cno:function(){ui.cc=false;render()},
cyes:function(){var b=byId(S.cur);if(b){b.cancelled=true;b.call="Cancelled";save()}ui.cc=false;toast("Request cancelled");if(route==="call")go("history");else render()},
open:function(v){S.cur=v;go("track")},
useloc:function(v){F.loc=v;ui={};render()},
confloc:function(){var v=(F.loc||"").trim();if(v.length<3){ui.msg="Please enter a location (at least 3 characters).";ui.ok=false;render();return}
 S.loc=v;if(S.saved.indexOf(v)<0)S.saved.unshift(v);S.saved=S.saved.slice(0,8);save();toast("Location confirmed ✓");go("home")},
geo:function(){if(!navigator.geolocation){ui.msg="Geolocation isn’t available here. Please enter your location manually.";ui.ok=false;render();return}
 ui.busy=true;ui.msg="";render();
 navigator.geolocation.getCurrentPosition(function(p){ui.busy=false;F.loc="GPS: "+p.coords.latitude.toFixed(4)+", "+p.coords.longitude.toFixed(4);ui.msg="Location found. Edit it if you like, then confirm.";ui.ok=true;render()},
  function(err){ui.busy=false;ui.msg=err&&err.code===1?"Location permission denied. Please enter your location manually.":"Couldn’t get your location. Please enter it manually.";ui.ok=false;render()},{timeout:8000});},
scroll:function(v){var t=document.getElementById(v);if(t)t.scrollIntoView({behavior:window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})},
book:function(v){F={};if(v!=="fuel")F.sub=v;go(v==="fuel"?"fuel":"roadside")},
demo:function(){toast("Demo only – no real call is placed")},
answer:function(){var b=byId(S.cur);if(!b)return;ui.stage="live";callStart=Date.now();clearInterval(CT);CT=setInterval(tick,1000);render();speak(b)},
replay:function(){var b=byId(S.cur);if(b)speak(b)},
cconf:function(){var b=byId(S.cur);if(!b||b.cancelled)return;b.call="Confirmed";b.confirmedAt=Date.now();save();stopCall();toast("Booking confirmed ✓");render()},
savename:function(){var n=(F.pname||"").trim();if(!n){toast("Enter a name first");return}S.name=n.slice(0,40);save();toast("Name saved ✓");render()},
addveh:function(){var n=(F.vn||"").trim();if(n.length<2){ui.ve="Enter a vehicle name or number.";render();return}if(S.vehicles.length>=6){ui.ve="Maximum 6 vehicles in the demo.";render();return}S.vehicles.push({t:F.vt||"Bike",n:n.slice(0,40)});F.vn="";F.vt=undefined;save();toast("Vehicle saved ✓");render()},
reset:function(){S={loc:"",saved:[],bookings:[],draft:null,cur:null,pay:"UPI",name:"Demo User",vehicles:[]};F={};save();toast("Demo data cleared");go("home")}
};
document.addEventListener("click",function(e){var el=e.target.closest("[data-a]");if(!el)return;var f=acts[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el)}});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches('.chip[data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener("input",function(e){var n=e.target.dataset&&e.target.dataset.f;if(!n)return;
 if(n==="q"){ui.q=e.target.value;var pos=e.target.selectionStart;render();var i=document.querySelector('[data-f="q"]');if(i){i.focus();try{i.setSelectionRange(pos,pos)}catch(x){}}return}
 F[n]=e.target.value;if(ui.e&&ui.e[n]){delete ui.e[n];var er=e.target.nextElementSibling;if(er&&er.className==="err")er.remove()}
 if(n==="qty")render()});
window.addEventListener("hashchange",function(){var r=location.hash.slice(1);r=ALIAS[r]||r;if(V[r]&&r!==route){stopCall();route=r;ui={};render()}});
var h=location.hash.slice(1);h=ALIAS[h]||h;if(V[h])route=h;render();
})();
</script>
